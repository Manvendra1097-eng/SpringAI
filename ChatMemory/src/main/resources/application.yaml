spring:
  application:
    name: ChatMemory

  ai:
    openai:
      api-key: ${OPEN_API_KEY}
      chat:
        model: ${OPEN_AI_MODEL}

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: h2

  datasource:
    url: jdbc:h2:file:./data/chat_memory;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: "123"

  h2:
    console:
      enabled: true
      path: /h2-console